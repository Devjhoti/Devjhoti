<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Devjhoti Sutradhar — Web developer from Bangladesh">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="0.55" stop-color="#0d1430"/>
      <stop offset="1" stop-color="#131c46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3c7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <rect width="1200" height="320" fill="#000"/>
      <circle cx="1020" cy="110" r="46" fill="#fff"/>
      <circle cx="1040" cy="96" r="42" fill="#000"/>
    </mask>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <style>
      .name{font:700 58px 'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;fill:#f8fafc;letter-spacing:-1px}
      .role{font:400 22px 'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;fill:#94a3b8}
      .mono{font:500 19px Consolas,'JetBrains Mono',Menlo,monospace;fill:#cbd5e1}
      .prompt{fill:#a78bfa}
      .cursor{animation:blink 1.1s steps(1) infinite}
      .tw{animation:tw 3.2s ease-in-out infinite}
      .d1{animation-delay:.4s}.d2{animation-delay:1.1s}.d3{animation-delay:1.8s}.d4{animation-delay:2.5s}
      .rise{opacity:0;animation:rise .9s ease-out forwards}
      .r2{animation-delay:.25s}.r3{animation-delay:.5s}
      @keyframes blink{50%{opacity:0}}
      @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
      @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){.cursor,.tw,.rise{animation:none;opacity:1}}
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#sky)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>

  <!-- stars -->
  <g fill="#e2e8f0">
    <circle class="tw" cx="640" cy="48" r="1.6"/>
    <circle class="tw d2" cx="720" cy="120" r="1.2"/>
    <circle class="tw d1" cx="820" cy="60" r="1.8"/>
    <circle class="tw d3" cx="900" cy="200" r="1.3"/>
    <circle class="tw d4" cx="1110" cy="52" r="1.5"/>
    <circle class="tw d2" cx="1140" cy="190" r="1.2"/>
    <circle class="tw d1" cx="960" cy="260" r="1.4"/>
    <circle class="tw d3" cx="760" cy="250" r="1.1"/>
    <circle class="tw" cx="1070" cy="270" r="1.6"/>
    <circle class="tw d4" cx="560" cy="30" r="1.1"/>
  </g>

  <!-- moon -->
  <circle cx="1020" cy="110" r="90" fill="url(#glow)"/>
  <rect width="1200" height="320" fill="#fef3c7" mask="url(#crescent)"/>

  <!-- text -->
  <g transform="translate(72 0)">
    <text class="name rise" x="0" y="132">Devjhoti Sutradhar</text>
    <rect class="rise r2" x="2" y="152" width="120" height="4" rx="2" fill="url(#accent)"/>
    <text class="role rise r2" x="0" y="196">Web developer · Bangladesh</text>
    <text class="mono rise r3" x="0" y="250"><tspan class="prompt">❯</tspan> building fast, animated websites for real businesses<tspan class="cursor" fill="#a78bfa"> ▍</tspan></text>
  </g>
</svg>
